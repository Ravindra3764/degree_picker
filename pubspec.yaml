name: degree_picker
description: Searchable degree picker and education qualification dropdown for Flutter forms. 1000+ degrees, diplomas, master and PhD worldwide, offline JSON, bottom sheet or dialog.
version: 0.1.0
repository: https://github.com/Ravindra3764/degree_picker
issue_tracker: https://github.com/Ravindra3764/degree_picker/issues
topics:
  - picker
  - education
  - form
  - dropdown
  - search

environment:
  sdk: ^3.4.0
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/degrees.json
