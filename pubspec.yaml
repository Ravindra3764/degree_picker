name: degree_picker
description: Searchable degree picker and education qualification dropdown for Flutter forms. 1000+ degrees, diplomas, master and PhD worldwide, offline JSON, bottom sheet or dialog.
version: 0.1.0
repository: https://github.com/Ravindra3764/degree_picker
issue_tracker: https://github.com/Ravindra3764/degree_picker/issues
topics:
  - picker
  - education
  - form
  - dropdown
  - search

screenshots:
  - description: Searchable bottom sheet with level filter chips.
    path: screenshots/2_sheet.png
  - description: Smart search by abbreviation, alias or name.
    path: screenshots/3_search.png
  - description: Dialog mode, limited to master and doctorate levels.
    path: screenshots/4_dialog.png
  - description: Fully custom styled picker.
    path: screenshots/5_custom_style.png

environment:
  sdk: ^3.4.0
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/degrees.json
